name: Android release APK

# Construit un APK "release" de CinéLog et publie une GitHub Release à
# chaque push sur main (une "version" = un commit, voir versionCode
# ci-dessous) et manuellement (workflow_dispatch). Les pushs qui ne
# touchent que la documentation ne déclenchent pas de build.
#
# Le versionCode Android est calculé à partir du nombre de commits (voir
# app.config.js), donc chaque push produit un tag/release unique (vX).
# Si les secrets de signature ne sont pas configurés, l'APK release est
# signé avec le keystore de debug (installable pour tester, mais PAS
# valable pour le Play Store).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour créer une GitHub Release sur les tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet, nécessaire pour compter les commits

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Compute Android versionCode from commit count
        run: echo "ANDROID_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Write TMDB access token
        run: echo "EXPO_PUBLIC_TMDB_ACCESS_TOKEN=${{ secrets.TMDB_ACCESS_TOKEN }}" >> .env

      - name: Check keystore secret
        run: echo "HAS_KEYSTORE=${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}" >> "$GITHUB_ENV"

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/cinelog-release.keystore"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/cinelog-release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --clean

      - name: Enable Gradle build cache
        run: echo "org.gradle.caching=true" >> android/gradle.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --parallel

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
            "out/CineLog-${{ env.ANDROID_VERSION_CODE }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinelog-release-apk
          path: out/*.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ env.ANDROID_VERSION_CODE }}" out/*.apk \
            --title "CinéLog v${{ env.ANDROID_VERSION_CODE }}" \
            --target "${{ github.sha }}" \
            --generate-notes
