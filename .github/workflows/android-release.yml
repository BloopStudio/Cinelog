name: Android release build

# Construit un APK et un AAB (App Bundle, requis pour le Play Store) "release"
# de CinéLog et publie une GitHub Release à
# chaque push sur main (une "version" = un commit, voir versionCode
# ci-dessous) et manuellement (workflow_dispatch). Les pushs qui ne
# touchent que la documentation ne déclenchent pas de build.
#
# Le versionCode Android est calculé à partir du nombre de commits (voir
# app.config.js), donc chaque push produit un tag/release unique (vX).
# Si les secrets de signature ne sont pas configurés, l'APK release est
# signé avec le keystore de debug (installable pour tester, mais PAS
# valable pour le Play Store).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour créer une GitHub Release sur les tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet, nécessaire pour compter les commits

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Compute Android versionCode from commit count
        run: echo "ANDROID_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Write TMDB access token
        run: echo "EXPO_PUBLIC_TMDB_ACCESS_TOKEN=${{ secrets.TMDB_ACCESS_TOKEN }}" >> .env

      - name: Write Firebase config
        # Sert à la synchro "Partager ma liste" entre téléphones. Ces valeurs
        # ne sont pas secrètes (protection via les règles Firestore), mais on
        # les garde en secrets GitHub par cohérence avec le reste du fichier.
        # Si absentes, la fonctionnalité est juste indisponible dans le build.
        run: |
          echo "EXPO_PUBLIC_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "EXPO_PUBLIC_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}" >> .env

      - name: Check keystore secret
        run: echo "HAS_KEYSTORE=${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}" >> "$GITHUB_ENV"

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/cinelog-release.keystore"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/cinelog-release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --clean

      - name: Enable Gradle build cache
        run: printf '\norg.gradle.caching=true\n' >> android/gradle.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Collect build outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
            "out/CineLog-${{ env.ANDROID_VERSION_CODE }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
            "out/CineLog-${{ env.ANDROID_VERSION_CODE }}.aab"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cinelog-release-${{ env.ANDROID_VERSION_CODE }}
          path: |
            out/*.apk
            out/*.aab

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ env.ANDROID_VERSION_CODE }}"
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes --cleanup-tag
          gh release create "$TAG" out/*.apk out/*.aab \
            --title "CinéLog $TAG" \
            --target "${{ github.sha }}" \
            --generate-notes

      - name: Check Play Store secret
        run: echo "HAS_PLAY_STORE=${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON != '' }}" >> "$GITHUB_ENV"

      - name: Decode Play Store service account
        # Le secret est encodé en base64 (même convention que le keystore
        # Android) : l'action ci-dessous veut le JSON brut dans un fichier,
        # donc on le décode ici plutôt que de le passer tel quel.
        if: env.HAS_PLAY_STORE == 'true'
        run: |
          echo "${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}" | base64 -d > "$RUNNER_TEMP/play-store-service-account.json"
          echo "PLAY_STORE_SERVICE_ACCOUNT_PATH=$RUNNER_TEMP/play-store-service-account.json" >> "$GITHUB_ENV"

      - name: Publish to Play Store (test fermé)
        # Uniquement pour un build signé release (pas debug) avec le compte
        # de service configuré. Piste "alpha" = le nom interne historique
        # de la piste "Test fermé" par défaut sur la Play Console — si tu as
        # renommé/créé une autre piste fermée, remplace la valeur ci-dessous
        # par son nom exact (visible dans l'URL de la piste sur la Play
        # Console).
        if: env.HAS_KEYSTORE == 'true' && env.HAS_PLAY_STORE == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ env.PLAY_STORE_SERVICE_ACCOUNT_PATH }}
          packageName: com.bloopstudio.cinelog
          releaseFiles: out/*.aab
          track: alpha
          status: completed
