name: Android release APK

# Construit un APK "release" de CinéLog :
# - à chaque push sur main (artefact de build, téléchargeable depuis l'onglet Actions)
# - à chaque tag "v*" (en plus, publie une GitHub Release avec l'APK joint)
# - manuellement (workflow_dispatch)
#
# Le versionCode Android est calculé à partir du nombre de commits (voir app.config.js).
# Si les secrets de signature ne sont pas configurés, l'APK release est signé avec le
# keystore de debug (installable pour tester, mais PAS valable pour le Play Store).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet, nécessaire pour compter les commits

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Compute Android versionCode from commit count
        run: echo "ANDROID_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Write TMDB access token
        run: echo "EXPO_PUBLIC_TMDB_ACCESS_TOKEN=${{ secrets.TMDB_ACCESS_TOKEN }}" >> .env

      - name: Decode release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/cinelog-release.keystore"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/cinelog-release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
            "out/CineLog-${{ env.ANDROID_VERSION_CODE }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinelog-release-apk
          path: out/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
