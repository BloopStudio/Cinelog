name: Diag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compute version code
        run: echo "ANDROID_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Write TMDB token
        run: echo "EXPO_PUBLIC_TMDB_ACCESS_TOKEN=${{ secrets.TMDB_ACCESS_TOKEN }}" >> .env

      - name: Check keystore secret
        run: echo "HAS_KEYSTORE=${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}" >> "$GITHUB_ENV"

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "would decode keystore here"

      - name: Fake build artifact
        run: |
          mkdir -p out
          echo "fake apk" > "out/CineLog-${{ env.ANDROID_VERSION_CODE }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: diag-artifact
          path: out/*.apk

      - name: Create release step
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" out/*.apk --title "${{ github.ref_name }}" --generate-notes
